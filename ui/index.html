      if (!menu) return open();
      if (e.key === "ArrowDown" && active === results.length - 1 && more) return loadMore(); // the end of what is read: the next page, not the top
      if (results.length) { active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length; renderMenu(); menu.querySelector(".active")?.scrollIntoView({ block: "nearest" }); }
    } else if (e.key === "Enter") {
      if (!menu) return;
      if ((e.ctrlKey || e.metaKey) && f.custom) { e.preventDefault(); addCustom(); } // the typed one, whatever was found
      else if (active >= 0 && results[active]) { e.preventDefault(); choose(results[active]); }
      else if (f.custom && state === "idle" && typedId() !== undefined) { e.preventDefault(); addCustom(); } // nothing found: the typed one
    } else if (e.key === "Escape") {
      if (menu) { e.preventDefault(); close(); }
    } else if (e.key === "Tab") close();
  });

  render();
  return {
    el: root,
    set(v) {
      ids = multi ? [...v] : v == null ? [] : [v];
      if (f.type === "set") ids.sort(order);
      render();
      resolve();
    },
  };
}

// The quantity control of the shop: plus | input | minus, joined.
function Counter({ type, decimals, min, max, step, onChange }) {
  const round = (v) => Math.round(v * 1e10) / 1e10;
  const clamp = (v) => Math.min(max ?? Infinity, Math.max(min ?? -Infinity, v));
  const plus = Button({ variant: "secondary", size: "icon", className: "counter-btn counter-plus", ariaLabel: "Increase" }, icon("plus"));
  const minus = Button({ variant: "secondary", size: "icon", className: "counter-btn counter-minus", ariaLabel: "Decrease" }, icon("minus"));
  const num = NumberInput({ type, decimals, min, max, className: "counter-input", onChange: (v) => { refresh(); onChange(v); } });
  // the width of the field comes from the longest value of the range, so the counter never changes size
  const drawn = (v) => (type === "int" ? String(v) : Number(v).toFixed(decimals));
  const longest = Math.max(3, ...[min, max].filter((x) => x != null).map((x) => drawn(x).length));
  num.el.style.width = longest + 1 + "ch";

  const refresh = () => {
    plus.disabled = max != null && num.value >= max;
    minus.disabled = min != null && num.value <= min;
  };
  const bump = (dir) => { const v = clamp(round(num.value + dir * step)); num.set(v); refresh(); onChange(v); };
  plus.onclick = () => bump(1);
  minus.onclick = () => bump(-1);

  return { el: el("div", { className: "counter" }, minus, num.el, plus), set(v) { num.set(v); refresh(); } };
}

// shadcn Breadcrumb: links to the parents, the current page last and not a link.
function Breadcrumb(items, afterName = false) {
  const list = el("ol", { className: "breadcrumb-list" });
  items.forEach((it, i) => {
    const last = i === items.length - 1;
    const item = el("li", { className: "breadcrumb-item" });
    if (i > 0 || afterName) { // a chevron before a crumb, inside it: the name (if it stands before) and the crumbs read as one line
      const sep = el("span", { className: "breadcrumb-separator", role: "presentation" }, icon("chevronRight"));
      sep.setAttribute("aria-hidden", "true");
      item.append(sep);
    }
    item.append(last
      ? el("span", { className: "breadcrumb-page", role: "link", textContent: it.label })
      : el("a", { className: "breadcrumb-link", href: it.href, textContent: it.label }));
    list.append(item);
  });
  return list;
}

// 1, 2 or 5 times a power of ten, close to span/20: a comfortable step for a decimal range
function niceStep(span) {
  const raw = span / 20;
  const p = 10 ** Math.floor(Math.log10(raw));
  const m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}

// ---- page ----

// Relative URLs, so the page works under any mount prefix.
async function api(method, path, body, signal) {
  const headers = {};
  if (token) headers.Authorization = "Bearer " + token;
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(path, {
    method, headers, cache: "no-store", signal,
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401) { showAuth(); throw new AuthError(); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function showAuth() {
  if (authShown) return; // the 5s refresh must not wipe what is being typed
  authShown = true;
  const input = Input({ type: "password", placeholder: "API token" });
  const go = () => { token = input.value; sessionStorage.setItem("tunables-token", token); signature = null; authShown = false; load(); };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  $("root").replaceChildren(el("div", { className: "auth" }, input, Button({ onclick: go }, "Open")));
  rows.clear();
}

// The header shows Save / Discard only while there are unsaved edits.
function updateBar() {
  const dirty = pending.size > 0 || groupsDirty();
  $("actions").hidden = !dirty;
  for (const b of $("actions").querySelectorAll("button")) b.disabled = saving;
  updateGroupMarks();
}

function tree(fields) {
  const root = { key: "", rows: [], groups: new Map() };
  for (const f of fields) {
    const parts = f.key.split(".");
    let node = root;
    for (const p of parts.slice(0, -1)) {
      if (!node.groups.has(p)) node.groups.set(p, { key: node.key ? node.key + "." + p : p, rows: [], groups: new Map() });
      node = node.groups.get(p);
    }
    node.rows.push({ name: parts[parts.length - 1], f });
  }
  return root;
}

// "child of" dots before a heading: none for the 1st level, one for the 2nd, two for the 3rd.
function depthMarker(level) {
  if (level < 2) return [];
  const m = el("span", { className: "depth" });
  for (let i = 1; i < Math.min(level, 3); i++) m.append(el("i", { className: "dot" }));
  return [m];
}

// Which groups are folded: what the struct tag says, until the person opens or folds one (kept in the browser, by source).
const collapseKey = (key) => ((lastData && lastData.meta && lastData.meta.name) || "") + "/" + key;
function storedFolds() {
  try { return JSON.parse(localStorage.getItem("tunables-collapsed") || "{}"); } catch { return {}; }
}
function isCollapsed(key, meta) {
  const stored = storedFolds()[collapseKey(key)];
  return stored === undefined ? !!meta.collapsed : !!stored;
}
function setCollapsed(key, value) {
  const all = storedFolds();
  all[collapseKey(key)] = value;
  try { localStorage.setItem("tunables-collapsed", JSON.stringify(all)); } catch { /* a browser that keeps nothing: it is folded for this visit */ }
}

// What a folded Rule says in its heading: "only rs, ua · except safari".
function ruleSummary(node) {
  const values = (name) => {
    const r = node.rows.find((x) => x.name === name);
    if (!r) return [];
    const v = pending.has(r.f.key) ? pending.get(r.f.key) : r.f.value;
    return Array.isArray(v) ? v : [];
  };
  const some = (a) => (a.length > 3 ? a.slice(0, 3).join(", ") + ", +" + (a.length - 3) : a.join(", "));
  const parts = [];
  const only = values("include");
  const except = values("exclude");
  if (only.length) parts.push("only " + some(only));
  if (except.length) parts.push("except " + some(except));
  return parts.join(" · ");
}

// A folded group still tells that something in it is not saved (an orange * after its name) and what a Rule holds.
function updateGroupMarks() {
  const unsaved = [...pending.keys()];
  for (const g of groupEls.values()) {
    g.section.classList.toggle("dirty", unsaved.some((k) => k.startsWith(g.node.key + ".")));
    if (g.summary) g.summary.textContent = ruleSummary(g.node);
  }
  // a feature that is off has its targeting folded: nothing is asked of who it is for
  for (const g of featureEls) {
    const r = g.node.rows.find((x) => x.name === "enabled");
    const on = r ? (pending.has(r.f.key) ? pending.get(r.f.key) : r.f.value) : true;
    g.section.classList.toggle("off", !on);
  }
}

// Opens the folded groups around a field, to show what is wrong with it.
function revealGroups(key) {
  for (const g of groupEls.values()) {
    if (key.startsWith(g.node.key + ".") && g.section.classList.contains("collapsed")) g.section.querySelector(".group-toggle").click();
  }
}

// Groups nest as they do in the struct (up to 3 levels): a heading, a card with its fields, then its subgroups.
// The hierarchy is the size of the heading and the faint "child of" dots before it; breadcrumbs are only at the top of a group's page.
// The groups of a feature, one under another, then "Add group".
function renderGroupList(node, level) {
  const gs = groupSetsOf().find((g) => g.key === node.key);
  const section = el("section", { className: "group group-list level-" + Math.min(level, 3) });
  const message = el("p", { className: "message", hidden: true });
  groupMessages.set(node.key, message);
  const children = [...node.groups].filter(([name]) => name !== "#list");
  const addButton = (label, onclick) => {
    const b = Button({ variant: "outline", size: "sm", className: "feature-add-button", type: "button" }, icon("plus"), el("span", { textContent: label }));
    b.onclick = onclick;
    return b;
  };
  const addGroupButton = addButton("Add group", () => addGroup(gs));
  if (children.length >= 2) { // two groups or more: each is a card with a name
    children.forEach(([childName, child], i) => {
      if (i > 0) section.append(el("div", { className: "group-or", role: "separator" }, el("span", { textContent: "or" })));
      section.append(renderGroup(child, level, childName, false));
    });
    section.append(message, el("div", { className: "feature-add" }, addGroupButton));
    return section;
  }
  // one group (it was made by the first targeting) or none: the page does not show a group, only its rules
  if (children.length === 1) appendChildren(section, children[0][1], level, groupMeta.get(children[0][1].key) || {}, true);
  let row = section.lastElementChild?.classList.contains("feature-add") ? section.lastElementChild : null;
  if (!row) {
    row = el("div", { className: "feature-add" });
    if (children.length === 0) { // the group is made when the first targeting is picked
      const rules = gs.groups.filter((g) => g.rule);
      const pick = addButton("Add targeting", () => openDialog({
        title: "Add targeting",
        description: "Who the feature is on for: a targeting is added with what it lets in and what it keeps out.",
        searchPlaceholder: "Search the targetings…",
        empty: "All the targetings are added.",
        opener: pick,
        items: rules.map((g) => ({ key: g.key, name: g.name || g.key, desc: g.desc || "" })),
        onPick: (it) => {
          shownRules.add(gs.key + "." + draftGroup(gs) + "." + it.key);
          rebuild();
          updateBar();
        },
      }));
      row.append(pick);
    }
    section.append(row);
  }
  if (children.length > 0) row.append(addGroupButton); // with no group only a targeting is added: it makes the first one
  row.before(message);
  return section;
}
const groupMessages = new Map(); // key of a list -> the line that says what is wrong with it

// the switch of a feature goes in its heading, not in a row of its own
function powerSwitch(node, title) {
  const enabled = node.rows.find((x) => x.name === "enabled" && x.f.type === "bool");
  if (!enabled) return null;
  const row = makeRow(enabled.f.name || "Enabled", enabled.f);
  rows.set(enabled.f.key, row);
  const power = row.el.querySelector(".switch");
  power.classList.add("group-switch");
  power.setAttribute("aria-label", (enabled.f.name || "Enabled") + ": " + title);
  power.title = enabled.f.desc || "Switched off, the feature is off for everybody";
  return { power, messages: [...row.el.querySelectorAll(".message")] };
}

function renderGroup(node, level, name, inFeature = false, flat = false) {
  const meta = groupMeta.get(node.key) || {};
  if (meta.groupList) return renderGroupList(node, level);
  const title = meta.name || name;
  const section = el("section", { className: "group level-" + Math.min(level, 3) + (meta.rule ? " rule" : "") + (meta.feature ? " feature" : "") + (meta.targetGroup ? " target-group" : "") });
  if (level > 0) {
    let link = el("a", { className: "heading-link", href: "#/" + encodeURIComponent(node.key), title: "Open " + title }, title, icon("chevronRight"));
    let nameRow = null;
    if (meta.targetGroup) { // a group of a feature has its name in the heading, to be changed there
      const f = node.rows.find((x) => x.name === "name").f;
      nameRow = makeRow("Name", f);
      rows.set(f.key, nameRow);
      link = nameRow.el.querySelector("input");
      link.classList.add("group-name");
      link.placeholder = meta.name; // nothing typed: "Group A", the name the server gives
      link.setAttribute("aria-label", "Name of the group");
    }
    // a group can be folded: by what its struct tag says (collapsed), until someone opens or folds it, which the browser remembers
    const folded = isCollapsed(node.key, meta);
    section.classList.toggle("collapsed", folded);
    const toggle = el("button", { type: "button", className: "group-toggle", ariaExpanded: String(!folded), ariaLabel: (folded ? "Expand " : "Collapse ") + title }, icon("chevronDown"));
    toggle.onclick = () => {
      const now = !section.classList.contains("collapsed");
      section.classList.toggle("collapsed", now);
      toggle.setAttribute("aria-expanded", String(!now));
      toggle.setAttribute("aria-label", (now ? "Expand " : "Collapse ") + title);
      setCollapsed(node.key, now);
    };
    const summary = meta.rule ? el("span", { className: "group-summary" }) : null; // what a folded Rule holds
    groupEls.set(node.key, { section, node, summary });
    // a Rule of a feature is added from a list: here it is taken away again (what it held is emptied, saved with the rest)
    const removes = meta.rule && inFeature || meta.targetGroup;
    const remove = removes ? el("button", { type: "button", className: "group-toggle group-remove", ariaLabel: "Remove " + title, title: meta.targetGroup ? "Remove the group" : "Remove" }, icon("luX")) : null;
    if (remove) remove.onclick = () => (meta.targetGroup ? removeGroup(groupSetsOf().find((g) => g.key === meta.setKey), meta.groupId) : removeRule(node));
    const traffic = meta.targetGroup ? trafficButton(node) : meta.feature ? featureTraffic(node) : null;
    const enabled = meta.feature ? powerSwitch(node, title) : null;
    const power = enabled && enabled.power;
    // a group of a feature is a card: no dots before its name; the rules in it have one, the card is their parent
    const marker = meta.targetGroup ? [] : meta.rule && inFeature && !flat ? depthMarker(2) : depthMarker(level);
    const heading = el("h" + Math.min(level + 1, 4), { className: "heading" }, ...marker, link, ...(summary ? [summary] : []), ...(traffic ? [traffic] : []), ...(remove ? [remove] : []), ...(power ? [power] : []), toggle);
    const head = el("div", { className: "group-head" }, heading);
    if (meta.desc) head.append(el("p", { textContent: meta.desc }));
    if (enabled) head.append(...enabled.messages);
    section.append(head);
  }
  const shown = level > 0 && (meta.feature || meta.targetGroup) ? node.rows.filter((x) => !(meta.feature && x.name === "enabled" && x.f.type === "bool") && !(meta.targetGroup && ["name", "percent", "split"].includes(x.name))) : node.rows;
  if (shown.length) section.append(rowsCard(shown.length === node.rows.length ? node : { ...node, rows: shown }, level === 0));
  if (meta.feature) featureEls.push({ section, node });
  appendChildren(section, node, level + 1, meta);
  return section;
}

// The subgroups of a group. A feature shows the rules that hold something, or were added: the others are added from a list.
function appendChildren(parent, node, level, meta, flat = false) {
  let children = [...node.groups];
  if (meta.targetGroup) { // the rules that were added here come after the others, in the order they were added
    const added = [...shownRules].map((key) => children.find(([, c]) => c.key === key)).filter(Boolean);
    children = [...children.filter(([, c]) => !shownRules.has(c.key)), ...added];
  }
  for (const [childName, child] of children) {
    const rule = (groupMeta.get(child.key) || {}).rule;
    if (meta.targetGroup && rule && !isRuleActive(child)) continue;
    parent.append(renderGroup(child, level, childName, !!meta.targetGroup, flat));
  }
  if (meta.targetGroup) { // under the rules, always: the share of the traffic, then the button that adds a rule
    const add = featureAdd(node);
    if (add) parent.append(add);
  }
}

// the standard name of the n-th group, as the server gives it: "Group A" ... "Group Z", "Group AA"
function groupLetters(n) {
  let letters = "";
  for (; n > 0; n = Math.floor((n - 1) / 26)) letters = String.fromCharCode(65 + ((n - 1) % 26)) + letters;
  return "Group " + letters;
}

// ---- the groups of a feature: one value on the server (features.x.groups), groups and fields of their own on the page ----
const groupDrafts = new Map(); // key of a list -> [{id}]: the groups that were added here
const groupDeleted = new Set(); // "list key \0 id": the groups that were taken away here
const groupSetsOf = () => (lastData && lastData.schema.groupSets) || [];
const deletedKey = (setKey, id) => setKey + "\u0000" + id;

// the saved groups that were not taken away, then the new ones
function groupItems(gs) {
  const kept = gs.items.filter((it) => !groupDeleted.has(deletedKey(gs.key, it.id)));
  return [...kept, ...(groupDrafts.get(gs.key) || []).map((d) => ({ id: d.id, name: "", percent: null, random: false, values: {}, draft: true }))];
}

// the schema with every group as groups and fields (features.x.groups.<id>.country.include)
function expand(schema) {
  const fields = [...schema.fields];
  const groups = [...schema.groups];
  for (const gs of schema.groupSets || []) {
    groups.push({ key: gs.key, name: "Targeting", groupList: true, setKey: gs.key });
    fields.push({ key: gs.key + ".#list", type: "string", ui: "input", name: "", value: "", default: "" }); // makes the node of the list
    groupItems(gs).forEach((it, i) => {
      const base = gs.key + "." + it.id;
      groups.push({ key: base, name: it.name || groupLetters(i + 1), targetGroup: true, setKey: gs.key, groupId: it.id });
      fields.push({ key: base + ".name", type: "string", ui: "input", name: "Name", value: it.name, default: "", modified: false });
      fields.push({ key: base + ".percent", type: "int", ui: "slider", name: "Percent", min: 0, max: 100, value: it.percent ?? 100, default: 100, modified: false });
      fields.push({ key: base + ".split", type: "string", ui: "buttons", enum: ["murmurhash", "random"], name: "Split by", value: it.random ? "random" : "murmurhash", default: "murmurhash", modified: false });
      for (const f of gs.fields) fields.push({ ...f, key: base + "." + f.key, value: f.key in it.values ? it.values[f.key] : f.value, modified: false });
      for (const g of gs.groups) groups.push({ ...g, key: base + "." + g.key });
    });
  }
  return { ...schema, fields, groups };
}

const underSet = (gs, key) => key.startsWith(gs.key + ".");
const groupSetDirty = (gs) =>
  (groupDrafts.get(gs.key) || []).length > 0 ||
  [...groupDeleted].some((k) => k.startsWith(gs.key + "\u0000")) ||
  [...pending.keys()].some((k) => underSet(gs, k));
const groupsDirty = () => groupSetsOf().some(groupSetDirty);

// the list as it goes to the server: what is empty is left out, a group with nothing in it too
function composeGroups(gs) {
  const at = (key, saved) => (pending.has(key) ? pending.get(key) : saved);
  const groups = [];
  for (const it of groupItems(gs)) {
    const base = gs.key + "." + it.id;
    const targeting = {};
    for (const f of gs.fields) {
      const v = at(base + "." + f.key, f.key in it.values ? it.values[f.key] : f.value);
      if (Array.isArray(v) ? v.length === 0 : v == null || v === "") continue;
      const path = f.key.split(".");
      let o = targeting;
      for (const part of path.slice(0, -1)) o = (o[part] ??= {});
      o[path[path.length - 1]] = v;
    }
    const percent = at(base + ".percent", it.percent ?? 100);
    const share = percent < 100; // 100 is all of the traffic: nothing is kept
    if (Object.keys(targeting).length > 0 || share) {
      groups.push({ id: it.id, name: at(base + ".name", it.name), ...(share ? { percent } : {}), ...(share && at(base + ".split", it.random ? "random" : "murmurhash") === "random" ? { random: true } : {}), targeting });
    }
  }
  return groups;
}

function draftGroup(gs) {
  const id = "n" + Math.random().toString(36).slice(2, 8);
  groupDrafts.set(gs.key, [...(groupDrafts.get(gs.key) || []), { id }]);
  return id;
}

function addGroup(gs) {
  const id = draftGroup(gs);
  rebuild();
  updateBar();
  groupEls.get(gs.key + "." + id)?.section.querySelector(".group-name")?.focus();
}

function removeGroup(gs, id) {
  const drafts = groupDrafts.get(gs.key) || [];
  if (drafts.some((d) => d.id === id)) groupDrafts.set(gs.key, drafts.filter((d) => d.id !== id));
  else groupDeleted.add(deletedKey(gs.key, id));
  for (const k of [...pending.keys()]) if (k.startsWith(gs.key + "." + id + ".")) pending.delete(k);
  rebuild();
  updateBar();
}

// ---- the share of the traffic of a group: a button, and a dialog with its two fields ----
const fieldOf = (node, name) => node.rows.find((x) => x.name === name);
const valueOf = (r) => (pending.has(r.f.key) ? pending.get(r.f.key) : r.f.value);

// the button of a feature that has one group: that group has no heading, so it is by the switch of the feature
function featureTraffic(feature) {
  const list = [...feature.groups.values()].find((c) => (groupMeta.get(c.key) || {}).groupList);
  const groups = list ? [...list.groups].filter(([name]) => name !== "#list") : [];
  return groups.length === 1 ? trafficButton(groups[0][1]) : null;
}

function trafficButton(node) {
  const share = () => {
    const p = fieldOf(node, "percent");
    return p ? valueOf(p) : 100;
  };
  const button = el("button", { type: "button", className: "group-toggle group-share-button", ariaLabel: "Traffic", title: "Traffic" });
  // nothing is set: the settings icon; a share: a ring filled by it, the number, and how it is cut (a hash, or dice)
  const update = () => {
    const p = share();
    const random = fieldOf(node, "split") && valueOf(fieldOf(node, "split")) === "random";
    button.classList.toggle("set", p < 100);
    button.title = button.ariaLabel = p < 100 ? "Traffic: " + p + "%, " + (random ? "random" : "murmurhash") : "Traffic";
    if (p >= 100) return button.replaceChildren(icon("sliders"));
    const ring = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    ring.setAttribute("viewBox", "0 0 20 20");
    ring.classList.add("share-ring");
    const arc = 2 * Math.PI * 7;
    ring.innerHTML = '<circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="3" transform="rotate(-90 10 10)" stroke-dasharray="' + (arc * p) / 100 + " " + arc + '"/>';
    button.replaceChildren(ring, el("span", { className: "group-share", textContent: p + "%" }), icon(random ? "shuffle" : "hash"));
  };
  update();
  button.onclick = () => openPanel({ title: "Traffic", opener: button, rows: node.rows.filter((x) => x.name === "percent" || x.name === "split"), node, onClose: update });
  return button;
}

// a dialog with the fields of a group (no list to pick from)
function openPanel({ title, opener, rows: fieldRows, node, onClose }) {
  const overlay = el("div", { className: "dialog-overlay" });
  const close = el("button", { type: "button", className: "dialog-close", ariaLabel: "Close" }, icon("luX"));
  const panel = el("div", { className: "dialog", role: "dialog", ariaLabel: title },
    el("div", { className: "dialog-head" }, el("h2", { textContent: title })),
    close, rowsCard({ ...node, rows: fieldRows }, true));
  overlay.append(panel);
  const prevOverflow = document.body.style.overflow;
  const done = () => {
    overlay.remove();
    document.body.style.overflow = prevOverflow;
    removeEventListener("keydown", onKey, true);
    onClose?.();
    opener?.focus();
  };
  const onKey = (e) => { if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(); } };
  close.onclick = done;
  overlay.addEventListener("pointerdown", (e) => { if (e.target === overlay) done(); });
  document.body.style.overflow = "hidden";
  addEventListener("keydown", onKey, true);
  document.body.append(overlay);
  close.focus();
}

// ---- the rules of a feature: added from a list in a dialog ----
const shownRules = new Set(); // the rules added in this visit that hold nothing yet

const ruleValues = (node, name) => {
  const r = node.rows.find((x) => x.name === name);
  if (!r) return [];
  const v = pending.has(r.f.key) ? pending.get(r.f.key) : r.f.value;
  return Array.isArray(v) ? v : [];
};
const isRuleActive = (node) => shownRules.has(node.key) || ruleValues(node, "include").length > 0 || ruleValues(node, "exclude").length > 0;

function featureAdd(node) {
  const available = () => [...node.groups.values()].filter((c) => (groupMeta.get(c.key) || {}).rule && !isRuleActive(c));
  if (available().length === 0 && ![...node.groups.values()].some((c) => (groupMeta.get(c.key) || {}).rule)) return null;
  const button = Button({ variant: "outline", size: "sm", className: "feature-add-button", type: "button" }, icon("plus"), el("span", { textContent: "Add targeting" }));
  button.onclick = () => {
    const list = available();
    openDialog({
      title: "Add targeting",
      description: "Who the feature is on for: a targeting is added with what it lets in and what it keeps out.",
      searchPlaceholder: "Search the targetings…",
      empty: "All the targetings are added.",
      opener: button,
      items: list.map((c) => {
        const m = groupMeta.get(c.key) || {};
        return { key: c.key, name: m.name || c.key.split(".").pop(), desc: m.desc || "" };
      }),
      onPick: (it) => {
        shownRules.add(it.key);
        rebuild();
        const g = groupEls.get(it.key);
        if (g) {
          if (g.section.classList.contains("collapsed")) g.section.querySelector(".group-toggle:not(.group-remove)").click();
          g.section.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      },
    });
  };
  const host = el("div", { className: "feature-add" }, button);
  return host;
}

function removeRule(node) {
  for (const name of ["include", "exclude"]) {
    const r = node.rows.find((x) => x.name === name);
    const row = r && rows.get(r.f.key);
    if (row && ruleValues(node, name).length) row.set([]);
  }
  shownRules.delete(node.key);
  rebuild();
}

// Draws the page again from what it has (what is shown depends on more than the schema), keeping the unsaved edits.
function rebuild() {
  signature = null;
  show(lastData.meta, lastData.schema);
}

// A dialog with a list to pick from, like the ones of the shop: a search, the rows (a name and what it is), Esc or a click outside closes it.
function openDialog({ title, description, searchPlaceholder, empty, opener, items, onPick }) {
  const overlay = el("div", { className: "dialog-overlay" });
  const search = Input({ placeholder: searchPlaceholder || "Search…", autocomplete: "off" });
  const list = el("div", { className: "dialog-list", role: "listbox" });
  const close = el("button", { type: "button", className: "dialog-close", ariaLabel: "Close" }, icon("luX"));
  const panel = el("div", { className: "dialog", role: "dialog", ariaLabel: title },
    el("div", { className: "dialog-head" }, el("h2", { textContent: title }), ...(description ? [el("p", { textContent: description })] : [])),
    close, search, list);
  overlay.append(panel);

  let shown = items;
  let active = 0;
  function render() {
    list.replaceChildren();
    if (shown.length === 0) list.append(el("div", { className: "pick-note", textContent: items.length === 0 ? empty || "Nothing to add." : "Nothing found" }));
    shown.forEach((it, i) => {
      const row = el("div", { className: "dialog-item" + (i === active ? " active" : ""), role: "option" },
        el("span", { className: "dialog-item-name", textContent: it.name }),
        ...(it.desc ? [el("span", { className: "dialog-item-desc", textContent: it.desc })] : []));
      row.setAttribute("aria-selected", String(i === active));
      row.onclick = () => { done(); onPick(it); };
      row.onmousemove = (ev) => { if (active !== i && (ev.movementX || ev.movementY)) { active = i; render(); } };
      list.append(row);
    });
    list.querySelector(".active")?.scrollIntoView({ block: "nearest" });
  }
  function done() {
    overlay.remove();
    document.body.style.overflow = prevOverflow;
    removeEventListener("keydown", onKey, true);
    opener?.focus();
  }
  function onKey(e) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (shown.length) { active = (active + (e.key === "ArrowDown" ? 1 : -1) + shown.length) % shown.length; render(); }
    } else if (e.key === "Enter" && shown[active]) { e.preventDefault(); const it = shown[active]; done(); onPick(it); }
    else if (e.key === "Tab") { // the focus stays in the dialog
      const focusable = [close, search];
      const i = focusable.indexOf(document.activeElement);
      e.preventDefault();
      focusable[(i + (e.shiftKey ? -1 : 1) + focusable.length) % focusable.length].focus();
    }
  }
  search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    shown = q ? items.filter((it) => (it.name + " " + it.desc).toLowerCase().includes(q)) : items;
    active = 0;
    render();
  };
  close.onclick = done;
  overlay.addEventListener("pointerdown", (e) => { if (e.target === overlay) done(); });
  const prevOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  addEventListener("keydown", onKey, true);
  document.body.append(overlay);
  render();
  search.focus();
}

// The fields of a group go into a card; the ones of the root (no struct around them) are plain rows.
function rowsCard(node, plain = false) {
  const rule = !plain && (groupMeta.get(node.key) || {}).rule; // a Rule: Only or Except, one at a time
  const card = el("div", { className: plain ? "rows" : "card" + (rule ? " rule" : "") });
  const made = node.rows.map((r) => {
    const row = makeRow(r.f.name || r.name, r.f);
    rows.set(r.f.key, row);
    return { name: r.name, row };
  });
  const only = made.find((m) => m.name === "include");
  const except = made.find((m) => m.name === "exclude");
  // A Rule holds one of the two as far as the page is concerned: a switch in the row of its search says which, and moves what
  // is in the list to the other. (Both can be set through the API: then they are shown one under the other, as they are, with no switch.)
  if (rule && only && except && !(ruleValues(node, "include").length && ruleValues(node, "exclude").length)) {
    let mode = ruleValues(node, "exclude").length ? "Except" : "Only";
    const switches = [];
    const sync = () => {
      only.row.el.hidden = mode !== "Only";
      except.row.el.hidden = mode !== "Except";
      for (const sw of switches) sw.set(mode);
    };
    const choose = (m) => {
      if (m === mode) return;
      const [from, to] = m === "Except" ? [only, except] : [except, only];
      const values = ruleValues(node, from.name);
      mode = m;
      if (values.length) { // what was chosen stays chosen, on the other side
        to.row.set(values);
        from.row.set([]);
      }
      sync();
    };
    for (const m of [only, except]) { // each list has its own switch, in the row of its search: one is shown at a time
      const sw = ButtonGroup(["Only", "Except"], choose);
      switches.push(sw);
      const adder = m.row.el.querySelector(".adder"); // typed values: the input and the plus
      if (adder) adder.append(sw.el);
      else { // picked from a source: the input
        const input = m.row.el.querySelector(".picker-input");
        const line = el("div", { className: "rule-line" });
        input.before(line);
        line.append(input, sw.el);
      }
    }
    card.classList.add("single");
    card.append(only.row.el, except.row.el);
    sync();
    return card;
  }
  for (const m of made) card.append(m.row.el);
  return card;
}

// A group opened on its own page (#/checkout.button): only the fields of that struct, and its subgroups.
function renderPage(node, ancestors) {
  const depth = ancestors.length; // the nesting of this group: its text is as big as it is in the whole view
  const meta = groupMeta.get(node.key) || {};
  const page = el("div", { className: "page" });
  // the title of the page: the group's own heading (the breadcrumbs above only say where it is)
  const section = el("section", { className: "group level-" + Math.min(depth, 3) });
  const enabled = meta.feature ? powerSwitch(node, ancestors[depth - 1]) : null;
  const traffic = meta.feature ? featureTraffic(node) : null;
  const head = el("div", { className: "group-head" }, el("h" + Math.min(depth + 1, 4), { className: "heading" }, ...depthMarker(depth), el("span", { textContent: ancestors[depth - 1] }), ...(traffic ? [traffic] : []), ...(enabled ? [enabled.power] : [])));
  if (meta.desc) head.append(el("p", { textContent: meta.desc }));
  if (enabled) head.append(...enabled.messages);
  section.append(head);
  const shown = enabled ? node.rows.filter((x) => !(x.name === "enabled" && x.f.type === "bool")) : node.rows;
  if (shown.length) section.append(rowsCard(shown.length === node.rows.length ? node : { ...node, rows: shown }));
  page.append(section);
  if (meta.feature) { page.classList.add("feature"); featureEls.push({ section: page, node }); }
  appendChildren(page, node, depth + 1, meta);
  return page;
}

// ---- routing: "#/checkout.button" is the page of that group, "" is the whole thing ----
let lastData = null;
const routeKey = () => (location.hash.startsWith("#/") ? decodeURIComponent(location.hash.slice(2)) : "");
function findNode(root, key) {
  let n = root;
  for (const part of key.split(".")) { n = n.groups.get(part); if (!n) return null; }
  return n;
}

// The component of a field is chosen by the schema (`ui`); these are the defaults by type.
const DEFAULT_UI = { bool: "switch", enum: "select", int: "counter", float: "counter", string: "input", duration: "input", list: "chips", set: "chips" };

// A row edits locally: changes go to `pending` and are sent by Save.
function makeRow(name, f) {
  const current = () => (pending.has(f.key) ? pending.get(f.key) : f.value);
  const mark = () => root.classList.toggle("dirty", pending.has(f.key)); // an orange * after the name while unsaved
  const itemSame = (a, b) => (f.item === "duration" || f.type === "duration" ? parseDur(a) === parseDur(b) : a === b); // "1m0s" is "60s"
  const same = (a, b) => (Array.isArray(a) && Array.isArray(b)
    ? a.length === b.length && (f.type === "set" ? a.every((x) => b.some((y) => itemSame(x, y))) : a.every((x, i) => itemSame(x, b[i])))
    : itemSame(a, b));
  const stage = (v) => {
    if (same(v, f.value)) pending.delete(f.key); else pending.set(f.key, v);
    message.hidden = true;
    mark();
    updateBar();
  };

  const text = el("div", { className: "field-text" }, el("div", { className: "label", textContent: name }));
  if (f.desc) text.append(el("p", { className: "description", textContent: f.desc }));
  const message = el("p", { className: "message", hidden: true });
  text.append(message);

  const ctl = el("div", { className: "ctl" });
  const ui = f.ui || DEFAULT_UI[f.type];

  // a number: its step, and how many decimals it is drawn with (from the schema, else from the step)
  const bounded = f.min != null && f.max != null;
  let step = f.type === "int" ? 1 : bounded ? niceStep(f.max - f.min) : 0.1;
  if (f.type === "float" && f.precision != null) step = Math.max(step, 10 ** -f.precision);
  const decimals = f.type === "int" ? 0 : f.precision ?? (String(step).split(".")[1] || "").length;
  const fmt = (v) => Number(v).toFixed(decimals);
  let setValue;
  let block = false;

  if (ui === "switch" || ui === "checkbox") {
    const c = (ui === "switch" ? Switch : Checkbox)(stage);
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "select") {
    const c = Select(f.enum, stage);
    c.el.classList.add("w-field");
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "buttons") {
    const c = ButtonGroup(f.enum, stage);
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "chips") {
    const c = Chips(f, stage);
    block = true;
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "picker") {
    const c = Picker(f, stage);
    block = true;
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "textarea") {
    const c = Textarea(stage);
    block = true;
    setValue = c.set;
    ctl.append(c.el);
  } else if (ui === "slider") {
    // the value is a field next to the track: drag the slider, or type the number, either one moves the other
    const input = NumberInput({ type: f.type, decimals, min: f.min, max: f.max, className: "slider-input", onChange: (v) => { stage(v); slider.set(v); } });
    input.el.style.width = `calc(${Math.max(fmt(f.min).length, fmt(f.max).length)}ch + 28px)`; // fits the longest value: nothing moves
    const slider = Slider({ min: f.min, max: f.max, step, onChange: (v) => { stage(v); input.set(v); } });
    ctl.append(
      el("div", { className: "w-slider slider-line" }, el("span", { className: "slider-end", textContent: fmt(f.min) }), slider.el, el("span", { className: "slider-end", textContent: fmt(f.max) })),
      input.el,
    );
    setValue = (v) => { slider.set(v); input.set(v); };
  } else if (ui === "counter") {
    const c = Counter({ type: f.type, decimals, min: f.min, max: f.max, step, onChange: stage });
    setValue = c.set;
    ctl.append(c.el);
  } else if (f.type === "int" || f.type === "float") { // ui "input" on a number
    const c = NumberInput({ type: f.type, decimals, min: f.min, max: f.max, className: bounded ? "num-field" : "w-field", onChange: stage });
    if (bounded) c.el.style.width = `calc(${Math.max(fmt(f.min).length, fmt(f.max).length, 3)}ch + 28px)`; // fits the longest value
    setValue = c.set;
    ctl.append(c.el);
  } else if (f.type === "duration") {
    const c = Duration({ min: f.min, max: f.max, onChange: stage });
    setValue = c.set;
    ctl.append(c.el);
  } else {
    const input = Input({ className: "w-field" });
    input.oninput = () => stage(input.value);
    setValue = (v) => { input.value = v; };
    ctl.append(input);
  }

  const root = el("div", { className: "field" + (block ? " field-block" : "") }, text, ctl);
  root.title = "default: " + (f.default ?? "nobody");

  // The server's view changed (after Save or the periodic refresh): keep unsaved edits, update the rest.
  function apply(next) {
    f = next;
    if (pending.has(f.key) && same(pending.get(f.key), f.value)) pending.delete(f.key);
    if (!pending.has(f.key) && !root.contains(document.activeElement)) setValue(f.value);
    root.title = "default: " + (f.default ?? "nobody");
    mark();
  }
  // Drop this row's unsaved edit.
  function discard() {
    pending.delete(f.key);
    setValue(f.value);
    message.hidden = true;
    mark();
  }
  setValue(current());
  mark(); // a row built while its edit is still unsaved (another page, a rebuild) shows the star at once
  return { el: root, apply, discard, set(v) { setValue(v); stage(v); }, fail(msg) { message.textContent = msg || ""; message.hidden = !msg; } };
}

async function saveAll() {
  if (saving || (pending.size === 0 && !groupsDirty())) return;
  let groupsSaved = false;
  saving = true;
  updateBar();
  try {
    for (const [key, value] of [...pending]) {
      if (groupSetsOf().some((gs) => underSet(gs, key))) continue; // the groups of a feature go as one value, below
      const row = rows.get(key);
      try {
        const next = await api("PUT", "values/" + encodeURIComponent(key), { value });
        pending.delete(key);
        if (row) { row.fail(null); row.apply(next); }
      } catch (e) {
        if (e instanceof AuthError) return;
        if (row) { row.fail(e.message); revealGroups(key); } // stays pending, so Save can be retried after fixing it
      }
    }
    for (const gs of groupSetsOf()) {
      if (!groupSetDirty(gs)) continue;
      const message = groupMessages.get(gs.key);
      try {
        await api("PUT", "values/" + encodeURIComponent(gs.key), { value: composeGroups(gs) });
        groupsSaved = true;
        groupDrafts.delete(gs.key);
        for (const k of [...groupDeleted]) if (k.startsWith(gs.key + "\u0000")) groupDeleted.delete(k);
        for (const k of [...pending.keys()]) if (underSet(gs, k)) pending.delete(k);
        if (message) message.hidden = true;
      } catch (e) {
        if (e instanceof AuthError) return;
        if (message) { message.textContent = e.message; message.hidden = false; }
      }
    }
  } finally {
    saving = false;
    updateBar();
  }
  if (groupsSaved) signature = null; // the groups that were saved are drawn from what the server has
  await load(); // fields that are not on this page are fresh when it is left
}

function discardAll() {
  if (saving) return;
  const structure = groupDrafts.size > 0 || groupDeleted.size > 0;
  groupDrafts.clear();
  groupDeleted.clear();
  for (const key of [...pending.keys()]) {
    const row = rows.get(key);
    if (row) row.discard(); else pending.delete(key);
  }
  if (structure) rebuild(); // the groups that were added are gone, the ones that were taken away are back
  updateBar();
}

// Builds (or refreshes) the page from the schema; used for the data that came with the page and for every poll.
function show(meta, raw) {
  lastData = { meta, schema: raw };
  const schema = expand(raw);
  groupMeta = new Map((schema.groups || []).map((g) => [g.key, g]));
  const root = tree(schema.fields);
  let key = routeKey();
  let node = key ? findNode(root, key) : root;
  if (!node) { // an old link to a group that is gone: show everything
    key = "";
    node = root;
    history.replaceState(null, "", location.pathname + location.search);
  }
  const parts = key ? key.split(".") : [];
  const titles = parts.map((seg, i) => (groupMeta.get(parts.slice(0, i + 1).join(".")) || {}).name || seg);

  $("banner").hidden = true;
  $("desc").textContent = key ? "" : (meta.description || "").trim(); // on a group's page the description sits under its heading
  document.title = [...titles.slice(-1), meta.name, "tunables"].join(" · ");

  // the header: the name on the main page; the name, then the breadcrumbs on the page of a group
  $("name").textContent = meta.name;
  $("heroName").textContent = meta.name;
  $("hero").hidden = !!key; // the name and the description are the top of the main page only
  $("crumbs").hidden = !key;
  if (key) {
    $("crumbs").replaceChildren(Breadcrumb([ // the name before them is the first crumb, a link to the main page
      ...titles.slice(0, -1).map((label, i) => ({ label, href: "#/" + encodeURIComponent(parts.slice(0, i + 1).join(".")) })),
      { label: titles[titles.length - 1] },
    ], true));
  }

  // the Rules of a feature that hold something (saved) are on the page: a change of those is a change of the page
  const held = schema.fields.filter((f) => Array.isArray(f.value) && f.value.length && (groupMeta.get(f.key.slice(0, f.key.lastIndexOf("."))) || {}).rule).map((f) => f.key);
  const sig = JSON.stringify([key, schema.groups, schema.fields.map((f) => [f.key, f.name, f.type, f.ui, f.enum, f.min, f.max, f.desc]), held]);
  if (sig !== signature) { // first render, another page, or the schema changed under us: rebuild, keeping unsaved edits
    signature = sig;
    const keys = new Set(schema.fields.map((f) => f.key));
    for (const k of [...pending.keys()]) if (!keys.has(k)) pending.delete(k);
    rows.clear();
    groupEls.clear();
    featureEls.length = 0;
    $("root").replaceChildren(key ? renderPage(node, titles) : renderGroup(root, 0, "", []));
    updateGroupMarks();
  } else {
    for (const f of schema.fields) {
      const row = rows.get(f.key);
      if (row) row.apply(f);
    }
  }
  updateBar();
  updateNavbar();
}

// The navbar is see-through while the hero is in view; when the hero has gone under it the navbar gets its blur,
// its line and the name (a group's page has no hero: it gets them as soon as the page is scrolled).
function updateNavbar() {
  const bar = $("bar");
  // a group's page has no title block: its navbar (the name, Save) is always drawn; on the main page it appears when the title has scrolled under it
  const stuck = $("hero").hidden || $("heroName").getBoundingClientRect().bottom <= bar.offsetHeight;
  bar.classList.toggle("stuck", stuck);
}

async function load() {
  try {
    const [meta, schema] = await Promise.all([api("GET", "meta"), api("GET", "schema")]);
    show(meta, schema);
  } catch (e) {
    if (e instanceof AuthError) return;
    $("banner").textContent = "Could not load: " + e.message;
    $("banner").hidden = false;
  }
}

addEventListener("hashchange", () => { scrollTo(0, 0); if (lastData) show(lastData.meta, lastData.schema); });
let scrollFrame = 0;
addEventListener("scroll", () => { cancelAnimationFrame(scrollFrame); scrollFrame = requestAnimationFrame(updateNavbar); }, { passive: true });

$("actions").append(
  // words on a desktop, icons on a phone (CSS)
  Button({ variant: "outline", id: "discard", className: "action", title: "Drop all unsaved changes", ariaLabel: "Discard", onclick: discardAll }, icon("luRotateCcw"), el("span", { className: "btn-text", textContent: "Discard" })),
  Button({ id: "save", className: "action", title: "Save (Ctrl/Cmd+S)", ariaLabel: "Save", onclick: saveAll }, icon("luCheck"), el("span", { className: "btn-text", textContent: "Save" })),
);
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveAll(); }
});
addEventListener("beforeunload", (e) => { if (pending.size) e.preventDefault(); });

// The server puts the current values into the page (not when a token is set): render them right away, with no
// request and no empty first paint, then keep the page live by polling.
const boot = JSON.parse($("boot").textContent);
if (boot) show(boot.meta, boot.schema); else load();
setInterval(load, 5000);
</script>
</body>
