<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tunables</title>
<style>
/* shadcn/ui (new-york, zinc) in plain CSS: the tokens and the component classes are the ones of the
   Tailwind build, written out. No build step. */
:root{color-scheme:light dark;--background:0 0% 100%;--foreground:240 10% 3.9%;--popover:0 0% 100%;--popover-foreground:240 10% 3.9%;--primary:240 5.9% 10%;--primary-foreground:0 0% 98%;--secondary:240 4.8% 95.9%;--secondary-foreground:240 5.9% 10%;--muted:240 4.8% 95.9%;--muted-foreground:240 3.8% 46.1%;--accent:240 4.8% 95.9%;--accent-foreground:240 5.9% 10%;--destructive:0 84.2% 60.2%;--border:240 5.9% 90%;--input:240 5.9% 90%;--ring:240 10% 3.9%;--orange:8 100% 57%;--radius:.5rem;--grey:240 5.9% 90%/.7;--grey-hover:240 4.9% 83.9%/.7;--shadow:0 1px 3px 0 rgb(0 0 0/.1),0 1px 2px -1px rgb(0 0 0/.1);--shadow-sm:0 1px 2px 0 rgb(0 0 0/.05);--shadow-md:0 4px 6px -1px rgb(0 0 0/.1),0 2px 4px -2px rgb(0 0 0/.1);--shadow-lg:0 10px 15px -3px rgb(0 0 0/.1),0 4px 6px -4px rgb(0 0 0/.1)}
@media (prefers-color-scheme:dark){:root{--background:240 10% 3.9%;--foreground:0 0% 98%;--popover:240 10% 3.9%;--popover-foreground:0 0% 98%;--primary:0 0% 98%;--primary-foreground:240 5.9% 10%;--secondary:240 3.7% 15.9%;--secondary-foreground:0 0% 98%;--muted:240 3.7% 15.9%;--muted-foreground:240 5% 64.9%;--accent:240 3.7% 15.9%;--accent-foreground:0 0% 98%;--destructive:0 62.8% 50.6%;--border:240 3.7% 15.9%;--input:240 3.7% 15.9%;--ring:240 4.9% 83.9%;--grey:240 3.7% 15.9%/.7;--grey-hover:240 5.2% 33.9%/.7}}
html{scrollbar-gutter:stable} /* room for the scrollbar is always kept: the page does not shift when it appears */
*{box-sizing:border-box;border-color:hsl(var(--border))}
body{position:relative;margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}

/* ---- Button: variants default | outline | secondary, sizes default | icon ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;border:0;border-radius:calc(var(--radius) - 2px);font-size:14px;line-height:20px;font-weight:500;transition:all .3s;user-select:none;cursor:pointer}
.btn:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.btn:disabled{pointer-events:none;opacity:.5}
.btn-default{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:var(--shadow-sm)}
.btn-default:hover{background:hsl(var(--primary)/.9)}
.btn-outline{border:1px solid hsl(var(--input));background:hsl(var(--background));color:inherit;box-shadow:var(--shadow-sm)}
.btn-outline:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.btn-secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));box-shadow:var(--shadow-sm)}
.btn-secondary:hover{background:hsl(var(--secondary)/.8)}
.btn-link{gap:8px;color:hsl(var(--primary));text-underline-offset:4px;text-decoration:none}
.btn-link:hover{text-decoration:underline}
.size-default{height:36px;padding:8px 16px}
.size-sm{height:32px;padding:0 12px;font-size:12px}
.size-icon{height:36px;width:36px}

/* ---- Input, Textarea ---- */
.input,.textarea{display:flex;width:100%;min-width:0;border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);background:hsl(var(--input)/.3);padding:4px 12px;font-size:14px;line-height:20px;color:inherit;box-shadow:var(--shadow-sm);transition:color .15s,box-shadow .15s}
.input{height:36px}
.textarea{min-height:60px;padding:8px 12px;resize:vertical}
.input::placeholder,.textarea::placeholder{color:hsl(var(--muted-foreground))}
.input:focus-visible,.textarea:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}

/* ---- Select: trigger, content, item ---- */
.select-trigger{display:flex;height:36px;width:100%;min-width:0;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);background:hsl(var(--input)/.3);padding:8px 12px;font-size:14px;line-height:20px;color:inherit;text-align:left;box-shadow:var(--shadow-sm);cursor:pointer}
.select-trigger:focus{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.select-trigger>span{overflow:hidden;text-overflow:ellipsis}
.select-trigger>svg{flex:none;width:16px;height:16px;opacity:.5}
.select-content{position:fixed;z-index:50;min-width:8rem;overflow-x:hidden;overflow-y:auto;border:1px solid hsl(var(--border));border-radius:calc(var(--radius) - 2px);background:hsl(var(--popover));color:hsl(var(--popover-foreground));box-shadow:var(--shadow-md);animation:select-in .15s ease-out}
.select-content[data-side=top]{transform-origin:bottom}
.select-content[data-side=bottom]{transform-origin:top}
@keyframes select-in{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.select-viewport{padding:4px}
.select-item{position:relative;display:flex;width:100%;align-items:center;border-radius:calc(var(--radius) - 4px);padding:6px 32px 6px 8px;font-size:14px;line-height:20px;cursor:pointer;user-select:none;outline:none}
.select-item[hidden]{display:none}
.select-content .select-search{width:calc(100% - 8px);margin:4px}
.select-item:hover,.select-item:focus{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.select-indicator{position:absolute;right:8px;display:flex;width:14px;height:14px;align-items:center;justify-content:center}
.select-indicator svg{width:16px;height:16px}

/* ---- a feature: its rules are added from a list; while it is off they are folded away ---- */
.feature-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.feature-add-button svg{width:16px;height:16px;margin-right:6px}
.group.feature.off>.group,.group.feature.off>.feature-add,.page.feature.off>.group:not(:first-child),.page.feature.off>.feature-add{display:none}

/* ---- Dialog: a list to pick from over the page ---- */
.dialog-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;background:rgb(0 0 0/.5);animation:select-in .15s ease-out}
.dialog{position:relative;display:flex;flex-direction:column;gap:16px;width:100%;max-width:32rem;max-height:80vh;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--background));color:hsl(var(--foreground));padding:24px;box-shadow:var(--shadow-md)}
.dialog-head h2{margin:0;padding-right:32px;font-size:18px;line-height:28px;font-weight:600;letter-spacing:-.025em}
.dialog-head p{margin:4px 0 0;font-size:14px;line-height:20px;color:hsl(var(--muted-foreground))}
.dialog-close{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;border:0;border-radius:calc(var(--radius) - 4px);background:transparent;color:hsl(var(--muted-foreground));cursor:pointer}
.dialog-close:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.dialog-close:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.dialog-close svg{width:16px;height:16px}
.dialog-list{display:flex;flex-direction:column;gap:2px;min-height:0;overflow-y:auto;margin:0 -8px;padding:0 8px}
.dialog-item{display:flex;flex-direction:column;gap:2px;border-radius:calc(var(--radius) - 4px);padding:8px 12px;cursor:pointer;user-select:none}
.dialog-item.active,.dialog-item:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.dialog-item-name{font-size:14px;line-height:20px;font-weight:500}
.dialog-item-desc{font-size:12px;line-height:16px;color:hsl(var(--muted-foreground))}
.group-remove{margin-left:auto}
.group-toggle.group-share-button{width:auto;min-width:28px;gap:4px;padding:0 6px;margin-left:auto;font-size:12px;font-weight:500}
.group-toggle.group-share-button.set{color:hsl(var(--foreground))}
.group-toggle.group-share-button+.group-remove{margin-left:0}
.group-toggle.group-share-button+.group-switch{margin-left:8px}
.share-ring{width:16px;height:16px;flex:none}
.group-share-button.set svg:last-child{width:14px;height:14px}
.group-remove+.group-toggle{margin-left:0}
.group.target-group{margin:0 0 12px;padding:14px 20px 16px;border:1px solid hsl(var(--border));border-radius:var(--radius)}
.group.target-group>.group-head{margin-bottom:4px}
.group.target-group.collapsed{padding-bottom:12px}
.group-or{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:hsl(var(--muted-foreground));font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.group-or::before,.group-or::after{content:"";flex:1;height:1px;background:hsl(var(--border))}
.heading .group-name{flex:1;min-width:0;height:auto;padding:2px 6px;margin-left:-6px;border:1px solid transparent;border-radius:calc(var(--radius) - 4px);background:transparent;box-shadow:none;color:inherit;font:inherit;letter-spacing:inherit}
.heading .group-name:hover{background:hsl(var(--muted))}
.heading .group-name:focus{outline:none;background:hsl(var(--background));border-color:hsl(var(--ring))}
.heading .group-name::placeholder{color:hsl(var(--muted-foreground));font-weight:400}
.group-switch{flex:none;margin-left:auto}
.group-switch+.group-toggle{margin-left:8px}
@media (max-width:640px){.dialog-overlay{padding:6vh 8px 8px}.dialog{padding:16px}}

/* ---- Switch, Checkbox, Radio group ---- */
.switch{display:inline-flex;flex:none;width:48px;height:28px;align-items:center;border:2px solid transparent;border-radius:9999px;padding:0;background:hsl(var(--input));cursor:pointer;transition:background-color .15s}
.switch:focus-visible{outline:none;box-shadow:0 0 0 2px hsl(var(--background)),0 0 0 4px hsl(var(--ring))}
.switch[data-state=checked]{background:hsl(var(--primary))}
.switch-thumb{pointer-events:none;display:block;width:24px;height:24px;border-radius:9999px;background:hsl(var(--background));box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .15s;transform:translateX(0)}
.switch[data-state=checked] .switch-thumb{transform:translateX(20px)}
.checkbox{display:inline-flex;flex:none;width:16px;height:16px;align-items:center;justify-content:center;border:1px solid hsl(var(--primary));border-radius:calc(var(--radius) - 4px);padding:0;background:transparent;color:hsl(var(--primary-foreground));box-shadow:var(--shadow-sm);cursor:pointer}
.checkbox:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.checkbox[data-state=checked]{background:hsl(var(--primary))}
.checkbox svg{width:14px;height:14px}

/* ---- Button group (SelectButtons of the shop): joined buttons, the chosen one is "default", the rest "secondary" ---- */
.select-buttons{display:flex;height:36px;min-width:14rem;max-width:100%;justify-content:space-between;gap:2px;padding:3px;overflow:hidden;border-radius:var(--radius);background:hsl(var(--muted))}
.select-buttons .btn{flex:1 1 auto;height:100%;border-radius:calc(var(--radius) - 3px);background:transparent;box-shadow:none;color:hsl(var(--muted-foreground));font-size:14px;transition-duration:.1s}
.select-buttons .btn:hover{color:hsl(var(--foreground))}
.select-buttons .btn[aria-checked=true]{background:hsl(var(--background));color:hsl(var(--foreground));box-shadow:var(--shadow-sm)}

/* ---- Slider ---- */
.slider{position:relative;display:flex;width:100%;height:32px;align-items:center;touch-action:none;user-select:none;cursor:pointer}
.slider-track{position:relative;display:block;height:12px;width:100%;flex-grow:1;overflow:hidden;border-radius:9999px;background:hsl(var(--primary)/.2)}
.slider-range{position:absolute;display:block;height:100%;background:hsl(var(--primary))}
.slider-thumb{position:absolute;display:block;width:16px;height:32px;border:1px solid hsl(var(--primary)/.5);border-radius:calc(var(--radius) - 4px);background:hsl(var(--background));box-shadow:0 1px 2px rgb(0 0 0/.15);transform:translateX(-50%);transition:color .15s}
.slider-thumb:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.slider-line{display:flex;align-items:center;gap:10px}
.slider-line .slider{flex:1 1 0;width:auto;min-width:0}
.slider-end{flex:none;color:hsl(var(--muted-foreground));font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}
/* shadcn InputGroup: one border and one focus ring around the number and its unit */
.duration{display:flex;align-items:center;overflow:hidden;height:36px;border:1px solid hsl(var(--input));border-radius:calc(var(--radius) - 2px);background:hsl(var(--background));box-shadow:var(--shadow-sm);transition:color .15s,box-shadow .15s}
.duration:has(.duration-input:focus-visible){box-shadow:0 0 0 1px hsl(var(--ring))}
.duration .duration-input{flex:none;height:100%;border:0;border-radius:0;background:transparent;box-shadow:none}
.duration .duration-input:focus-visible{box-shadow:none}
.duration .unit-select{flex:none;width:auto;height:100%;margin:0;gap:4px;border:0;border-left:1px solid hsl(var(--input));border-radius:0;background:hsl(var(--muted));box-shadow:none;padding:0 10px 0 12px;font-weight:500;color:hsl(var(--foreground))}
.duration .unit-select:hover,.duration .unit-select:focus{background:hsl(var(--accent));box-shadow:none}
.num-field{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.chips-box{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;max-width:100%;border:1px solid transparent;border-radius:calc(var(--radius) - 2px);background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));padding:2px 4px 2px 10px;font-size:14px;line-height:20px;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.chip-x{display:inline-flex;flex:none;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:0;border-radius:calc(var(--radius) - 4px);background:transparent;color:hsl(var(--muted-foreground));cursor:pointer}
.chip-x:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.chip-x:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.chip-x svg{width:14px;height:14px}
.chips-empty{font-size:14px;line-height:28px;color:hsl(var(--muted-foreground))}
.adder{display:flex;align-items:center;gap:8px;max-width:100%}
.chip-input{flex:none;width:12rem}
.chip-add{flex:none}
.slider-input{flex:none;width:auto;padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}

/* ---- Picker: entries of a data source, chosen as chips, searched in an input with a list under it ---- */
.picker{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%}
.picker-input{width:100%;max-width:24rem}
.avatar{display:inline-flex;flex:none;align-items:center;justify-content:center;width:24px;height:24px;border-radius:9999px;background:hsl(var(--muted));color:hsl(var(--muted-foreground));font-size:11px;line-height:1;font-weight:600;object-fit:cover;overflow:hidden;outline:1px solid hsl(var(--border));outline-offset:-1px}
/* a name without a picture is its first letter on a colour of its own (from the name), clear of the grey of a chip or of a row under the pointer */
.avatar.letter{--h:210;background:hsl(var(--h) 55% 88%);color:hsl(var(--h) 60% 26%);outline-color:hsl(var(--h) 40% 76%)}
@media (prefers-color-scheme:dark){.avatar.letter{background:hsl(var(--h) 35% 26%);color:hsl(var(--h) 70% 86%);outline-color:hsl(var(--h) 30% 38%)}}
.chip.has-avatar{padding-left:3px;gap:6px}
.chip-sub{flex:none;white-space:nowrap;color:hsl(var(--muted-foreground));font-weight:400;font-size:12px} /* the id is not broken: the name gives way */
.chip.missing{color:hsl(var(--muted-foreground));background:hsl(var(--muted));font-weight:400}
.pick-item{display:flex;align-items:center;gap:10px;border-radius:calc(var(--radius) - 4px);padding:6px 8px;font-size:14px;line-height:20px;cursor:pointer;user-select:none}
.pick-item:hover,.pick-item.active{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.pick-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-id{flex:none;white-space:nowrap;color:hsl(var(--muted-foreground));font-size:12px;font-variant-numeric:tabular-nums}
.pick-check{flex:none;display:flex;width:16px;height:16px}
.pick-check svg{width:16px;height:16px}
.pick-note{padding:10px 8px;font-size:14px;line-height:20px;color:hsl(var(--muted-foreground))}
.pick-note.error{color:hsl(var(--destructive))}
.pick-retry{cursor:pointer}
.pick-custom-host{position:sticky;top:0;z-index:1;border-bottom:1px solid hsl(var(--border));background:hsl(var(--popover))}
.pick-custom-host:empty{display:none}
.pick-custom{display:flex;align-items:center;gap:8px;margin:4px;border-radius:calc(var(--radius) - 4px);padding:6px 8px;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;user-select:none}
.pick-custom:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.pick-custom svg{flex:none;width:16px;height:16px}
.pick-custom span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-custom[aria-disabled=true]{opacity:.5;cursor:default;background:transparent}

/* ---- Counter: the quantity control of the shop (plus | input | minus), joined ---- */
.counter{display:flex;flex:none;justify-content:space-between}
.btn.counter-btn{background:hsl(var(--grey));color:hsl(var(--secondary-foreground))}
.btn.counter-btn:hover{background:hsl(var(--grey-hover))}
.counter-minus{border-radius:calc(var(--radius) - 2px) 0 0 calc(var(--radius) - 2px)}
.counter-plus{border-radius:0 calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0}
.counter-input{flex:none;min-width:2.4rem;padding:0;text-align:center;border-radius:0} /* the width is set from the longest value */

/* ---- Breadcrumb ---- */
/* inline, so that the crumbs run on after the name and wrap like words; a chevron leads each crumb and never stays behind it */
.breadcrumb-list{display:inline;margin:0;padding:0;list-style:none;font-size:14px;line-height:20px;color:hsl(var(--muted-foreground))}
.breadcrumb-item{display:inline-block;white-space:nowrap;margin-left:6px}
.breadcrumb-link{color:inherit;text-decoration:none;transition:color .15s}
.breadcrumb-link:hover{color:hsl(var(--foreground))}
.breadcrumb-page{font-weight:400;color:hsl(var(--foreground))}
.breadcrumb-separator{margin-right:6px}
.breadcrumb-separator svg{display:inline-block;width:14px;height:14px;vertical-align:-2px} /* on the baseline, its middle at the middle of the letters */
@media (min-width:640px){.breadcrumb-item{margin-left:10px}.breadcrumb-separator{margin-right:10px}}
nav[hidden],a.btn[hidden]{display:none}
/* the breadcrumbs go on in the navbar right after the name, at their own (shadcn) size; what does not fit wraps to the next line */
#crumbs{display:inline}
#crumbs[hidden]{display:none}

.actions[hidden]{display:none}

/* ---- Card ---- */
.card{overflow:hidden;border:1px solid hsl(var(--border));border-radius:calc(var(--radius) + 4px);background:hsl(var(--background));box-shadow:var(--shadow-sm)}

/* ---- Page: a card per group; the hierarchy is the size of the heading and the faint icons before it ---- */
/* the navbar is see-through over the hero; once the hero has gone under it, it gets its blur, its line and the name */
.bar{position:sticky;top:0;z-index:10;border-bottom:1px solid transparent;transition:border-color .3s,background-color .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
.bar.stuck{border-bottom-color:hsl(var(--border));background:hsl(var(--background)/.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar-title{display:inline-block;font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.025em;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.bar.stuck .bar-title{opacity:1;transform:none}
.bar-home{color:inherit;text-decoration:none;border-radius:calc(var(--radius) - 4px)}
.bar-home:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.bar:not(.stuck) .bar-home{pointer-events:none} /* the name is not there yet */
.hero{padding:0 0 36px}
.hero[hidden]{display:none}
.hero-title{margin:0;font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.035em;overflow-wrap:anywhere}
.hero-desc{margin:14px 0 0;max-width:38rem;font-size:20px;line-height:1.5;font-weight:450;white-space:pre-line;color:hsl(var(--foreground)/.85)}
.hero-desc:empty{display:none}
.action{width:6.5rem} /* the same width for both buttons */
.action svg{display:none;width:16px;height:16px}
.bar-in{display:flex;min-height:64px;max-width:768px;align-items:center;justify-content:space-between;gap:12px;margin:0 auto;padding:12px 24px}
.title{flex:1;min-width:0;line-height:20px} /* the name and the crumbs are one line of text: the same baseline, and a wrap goes on under the name */
.actions{display:flex;flex:none;gap:8px}
main{max-width:768px;margin:0 auto;padding:32px 24px calc(64px + env(safe-area-inset-bottom))}

/* levels: 1 is the biggest, every next level is smaller */
.group.level-1{margin-top:56px}
.group.level-2{margin-top:20px} /* a child sits close to the parent it belongs to */
.group.level-3{margin-top:16px}
#root>:first-child,.page>:first-child{margin-top:0}
.group-head{margin-bottom:8px}
.heading{margin:0;font-weight:700;letter-spacing:-.025em}
.level-1>.group-head>.heading{font-size:24px;line-height:32px}
.level-2>.group-head>.heading{font-size:20px;line-height:28px}
.level-3>.group-head>.heading{font-size:16px;line-height:24px}
/* the depth is told by a faint "child of" icon (lucide corner-down-right) before the heading: one for the 2nd level, two for the 3rd */
.heading{display:flex;align-items:center}
.depth{display:inline-flex;align-items:center;flex:none;gap:6px;margin-right:12px;color:hsl(var(--muted-foreground));opacity:.55}
.depth .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.group-toggle{display:inline-flex;flex:none;align-items:center;justify-content:center;width:28px;height:28px;margin-left:auto;padding:0;border:0;border-radius:calc(var(--radius) - 4px);background:transparent;color:hsl(var(--muted-foreground));cursor:pointer}
.group-toggle:hover{background:hsl(var(--accent));color:hsl(var(--accent-foreground))}
.group-toggle:focus-visible{outline:none;box-shadow:0 0 0 1px hsl(var(--ring))}
.group-toggle svg{width:16px;height:16px;transition:transform .15s}
.group.collapsed>.group-head .group-toggle svg{transform:rotate(-90deg)}
.group.collapsed>.card,.group.collapsed>.rows,.group.collapsed>.group{display:none}
.group.collapsed>.group-head{margin-bottom:0}
.group.rule.collapsed>.group-head p{display:none}
.group-summary{min-width:0;margin-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:hsl(var(--muted-foreground));font-size:14px;font-weight:400;letter-spacing:0}
.group:not(.collapsed)>.group-head .group-summary{display:none}
.group.collapsed.dirty>.group-head .heading-link::after{content:"*";margin-left:2px;color:hsl(var(--orange));font-weight:700}
.heading-link{display:inline-flex;align-items:center;gap:6px;color:inherit;text-decoration:none}
.heading-link svg{width:.7em;height:.7em;flex:none;opacity:.35;transition:opacity .15s,transform .15s}
.heading-link:hover svg,.heading-link:focus-visible svg{opacity:1;transform:translateX(2px)}
.heading-link:focus-visible{outline:none;border-radius:calc(var(--radius) - 4px);box-shadow:0 0 0 1px hsl(var(--ring))}
.group-head p{margin:2px 0 0;color:hsl(var(--muted-foreground));font-size:14px;line-height:20px}

.field{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding:14px 20px;box-shadow:inset 0 1px 0 hsl(var(--border))}
.card>.field:first-child{box-shadow:none}
/* a Rule of a targeting: one list at a time, Only or Except, switched in the row of its search (both are shown, one under the other, only when both hold something) */
.field[hidden]{display:none}
.rule-line{display:flex;align-items:center;gap:8px;width:100%}
.rule-line .picker-input{flex:1;min-width:0}
.card.rule.single .select-buttons{flex:none}
.card.rule.single>.field{min-height:0;box-shadow:none}
.card.rule.single .label{display:none} /* the switch says which it is */
.rows>.field{padding:12px 0;box-shadow:none} /* the fields of the root have no card around them */

.field-block{flex-direction:column;align-items:stretch;gap:8px;min-height:0}
.field-text{display:grid;min-width:0;gap:4px}
.label{font-size:16px;line-height:1;font-weight:500;overflow-wrap:anywhere} /* the same size on every level: only headings change */
.field.dirty .label::after{content:"*";margin-left:4px;color:hsl(var(--orange));font-weight:700}
.description{margin:0;color:hsl(var(--muted-foreground));font-size:14px;line-height:1.25}
.message{margin:0;color:hsl(var(--destructive));font-size:14px;line-height:1.25;font-weight:500}
.ctl{display:flex;flex:none;align-items:center;justify-content:flex-end;gap:12px}
.field-block .ctl{flex:1;justify-content:stretch}
.w-field{width:14rem}
.field-block .w-field{width:100%}
.w-slider{width:16rem}
.banner{margin:0 0 16px;color:hsl(var(--destructive));font-size:14px}
.auth{display:flex;gap:8px;max-width:24rem}

/* Phones: same layout, the control stays opposite the name */
@media (max-width:640px){
  .bar-in{min-height:56px;padding:10px 16px}
  .hero{padding:0 16px 24px}
  .hero-title{font-size:34px}
  .hero-desc{margin-top:10px;font-size:17px}
  .bar-title{font-size:18px}
  /* icons instead of words on the buttons of the navbar */
  .action{width:36px;padding:0}
  .action svg{display:block}
  .action .btn-text{display:none}
  main{padding:24px 0 calc(48px + env(safe-area-inset-bottom))}
  .banner{padding:0 16px}
  .group.level-1{margin-top:44px}
  .group.level-2{margin-top:18px}
  .group.level-3{margin-top:14px}
  .group-head{padding:0 16px}
  .card{border-radius:0;border-left:0;border-right:0;box-shadow:none}
  .level-1>.group-head>.heading{font-size:20px;line-height:28px}
  .level-2>.group-head>.heading{font-size:18px;line-height:26px}
  .level-3>.group-head>.heading{font-size:16px;line-height:24px}
  /* the name and its control share a line; a control that does not fit goes under the name */
  .field{flex-wrap:wrap;gap:8px 12px;padding:14px 16px}
  .rows>.field{padding:12px 16px}
  .field-text{flex:1 1 6rem}
  .ctl{flex:0 1 auto;min-width:0;gap:8px}
  .w-field{width:100%;min-width:0}
  .select-buttons{min-width:0;width:auto;flex:1 1 auto}
  .select-buttons .btn{min-width:0;padding:0 6px} /* many options still fit one line of the phone */
  .ctl:has(.w-field){flex:1.5 1 11rem}
  .ctl:has(.select-buttons){flex:1.5 1 auto} /* as wide as its buttons: many of them do not fit beside the name, so they wrap */
  /* a slider always gets a line of its own: the track, its ends and the number need the room */
  .field:has(.w-slider){flex-direction:column;align-items:stretch;gap:10px}
  .field:has(.w-slider) .field-text,.field:has(.w-slider) .ctl{flex:none}
  .field:has(.w-slider) .ctl{width:100%}
  .w-slider{width:auto;flex:1 1 0;min-width:0}
  .field-block .field-text{flex:none}
  .field-block .ctl{flex:1}
}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <div class="title"><a class="bar-home" href="#" aria-label="Main page"><span class="bar-title" id="name">tunables</span></a><nav id="crumbs" aria-label="breadcrumb" hidden></nav></div>
    <div class="actions" id="actions" hidden></div>
  </div>
</header>
<main>
  <section class="hero" id="hero">
    <h1 class="hero-title" id="heroName">tunables</h1>
    <p class="hero-desc" id="desc"></p>
  </section>
  <p class="banner" id="banner" hidden></p>
  <div id="root"></div>
</main>
<script type="application/json" id="boot">null</script>
<script>
"use strict";
class AuthError extends Error {}

const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("tunables-token") || "";
let signature = null;
let authShown = false;
let saving = false;
let groupMeta = new Map();
const rows = new Map();    // key -> {el, apply(field), discard(), fail(message)}
const groupEls = new Map(); // group key -> {section, node, summary}: what can be folded and told about
const featureEls = [];     // {section, node} of the features on the page: folded while they are off
const pending = new Map(); // key -> edited, not yet saved value

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  e.append(...kids);
  return e;
}

// Icons: Radix (select, checkbox) and Feather (counter), as the shop uses them. Static markup only.
const ICON = {
  chevronDown: '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3.13523 6.15803C3.3241 5.95657 3.64052 5.94637 3.84197 6.13523L7.5 9.56464L11.158 6.13523C11.3595 5.94637 11.6759 5.95657 11.8648 6.15803C12.0536 6.35949 12.0434 6.67591 11.842 6.86477L7.84197 10.6148C7.64964 10.7951 7.35036 10.7951 7.15803 10.6148L3.15803 6.86477C2.95657 6.67591 2.94637 6.35949 3.13523 6.15803Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>',
  check: '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M11.4669 3.72684C11.7558 3.91574 11.8369 4.30308 11.648 4.59198L7.39799 11.092C7.29783 11.2452 7.13556 11.3467 6.95402 11.3699C6.77247 11.3931 6.58989 11.3355 6.45446 11.2124L3.70446 8.71241C3.44905 8.48022 3.43023 8.08494 3.66242 7.82953C3.89461 7.57412 4.28989 7.55529 4.5453 7.78749L6.75292 9.79441L10.6018 3.90792C10.7907 3.61902 11.178 3.53795 11.4669 3.72684Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>',
  chevronRight: '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6.1584 3.13508C6.35985 2.94621 6.67627 2.95642 6.86514 3.15788L10.6151 7.15788C10.7954 7.3502 10.7954 7.64949 10.6151 7.84182L6.86514 11.8418C6.67627 12.0433 6.35985 12.0535 6.1584 11.8646C5.95694 11.6757 5.94673 11.3593 6.13559 11.1579L9.565 7.49985L6.13559 3.84182C5.94673 3.64036 5.95694 3.32394 6.1584 3.13508Z" fill="currentColor" fill-rule="evenodd" clip-rule="evenodd"></path></svg>',
  arrowLeft: '<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>',
  luCheck: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>',
  luRotateCcw: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>',
  sliders: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>',
  hash: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>',
  shuffle: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>',
  luX: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  plus: '<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
  minus: '<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
};
const icon = (name) => { const t = document.createElement("template"); t.innerHTML = ICON[name]; return t.content.firstChild; };

// ---- components (each returns {el, set(value)}) ----

function Button({ variant = "default", size = "default", className = "", ...props }, ...kids) {
  return el("button", { type: "button", ...props, className: `btn btn-${variant} size-${size} ${className}`.trim() }, ...kids);
}

function Input(props) {
  return el("input", { type: "text", autocomplete: "off", ...props, className: ("input " + (props.className || "")).trim() });
}

function Textarea(onChange) {
  const t = el("textarea", { className: "textarea", rows: 3 });
  t.oninput = () => onChange(t.value);
  return { el: t, set(v) { t.value = v; } };
}

function Switch(onChange) {
  let checked = false;
  const root = el("button", { type: "button", className: "switch", role: "switch" }, el("span", { className: "switch-thumb" }));
  const set = (v) => { checked = v; root.setAttribute("aria-checked", String(v)); root.dataset.state = v ? "checked" : "unchecked"; };
  root.onclick = () => { set(!checked); onChange(checked); };
  set(false);
  return { el: root, set };
}

function Checkbox(onChange) {
  let checked = false;
  const root = el("button", { type: "button", className: "checkbox", role: "checkbox" });
  const set = (v) => {
    checked = v;
    root.setAttribute("aria-checked", String(v));
    root.dataset.state = v ? "checked" : "unchecked";
    root.replaceChildren(...(v ? [icon("check")] : []));
  };
  root.onclick = () => { set(!checked); onChange(checked); };
  set(false);
  return { el: root, set };
}

// Joined buttons, as the shop's SelectButtons: the chosen one is the "default" variant, the others "secondary".
function ButtonGroup(options, onChange) {
  const buttons = new Map();
  const group = el("div", { className: "select-buttons", role: "radiogroup" });
  const set = (v) => {
    for (const [o, b] of buttons) {
      const on = o === v;
      b.className = "btn size-sm";
      b.setAttribute("aria-checked", String(on));
    }
  };
  for (const o of options) {
    const b = el("button", { type: "button", role: "radio", textContent: o });
    b.onclick = (e) => { e.preventDefault(); set(o); onChange(o); };
    buttons.set(o, b);
    group.append(b);
  }
  return { el: group, set };
}

// multi: the list stays open and each pick is switched on or off (isOn says which are on); the trigger shows only the placeholder
function Select(options, onChange, { multi = false, isOn = () => false, placeholder = "" } = {}) {
  let value = "";
  let menu = null;
  const label = el("span", { textContent: placeholder });
  const trigger = el("button", { type: "button", className: "select-trigger", role: "combobox" }, label, icon("chevronDown"));
  trigger.setAttribute("aria-haspopup", "listbox");
  trigger.setAttribute("aria-expanded", "false");

  const set = (v) => { value = v; label.textContent = multi ? placeholder : v; };
  const marked = (o) => (multi ? isOn(o) : o === value);

  function close(refocus) {
    if (!menu) return;
    menu.remove();
    menu = null;
    trigger.setAttribute("aria-expanded", "false");
    document.removeEventListener("pointerdown", outside, true);
    removeEventListener("resize", close);
    removeEventListener("scroll", onScroll, true);
    if (refocus === true) trigger.focus();
  }
  const outside = (e) => { if (menu && !menu.contains(e.target) && !trigger.contains(e.target)) close(false); };
  const onScroll = (e) => { if (menu && !menu.contains(e.target)) close(false); };

  function open() {
    if (menu) return;
    const items = options.map((o) => {
      const item = el("div", { className: "select-item", role: "option", tabIndex: -1 }, el("span", { textContent: o }),
        el("span", { className: "select-indicator" }));
      item.dataset.value = o;
      const mark = () => {
        const on = marked(o);
        item.setAttribute("aria-selected", String(on));
        item.querySelector(".select-indicator").replaceChildren(...(on ? [icon("check")] : []));
      };
      mark();
      item.onclick = () => {
        if (multi) { onChange(o); items.forEach((i) => i.mark()); return; }
        set(o); close(true); onChange(o);
      };
      item.mark = mark;
      return item;
    });
    // a multiple choice is searched, as a list of a source is
    const search = multi ? Input({ className: "select-search", placeholder: "Search…", spellcheck: false }) : null;
    if (search) {
      search.oninput = () => {
        const q = search.value.trim().toLowerCase();
        for (const i of items) i.hidden = !i.dataset.value.toLowerCase().includes(q);
      };
    }
    menu = el("div", { className: "select-content", role: "listbox" }, ...(search ? [search] : []), el("div", { className: "select-viewport" }, ...items));
    document.body.append(menu);
    trigger.setAttribute("aria-expanded", "true");

    // below the trigger, or above when there is no room
    const r = trigger.getBoundingClientRect();
    menu.style.minWidth = r.width + "px";
    const room = innerHeight - r.bottom - 8;
    const above = r.top - 8;
    const h = Math.min(menu.scrollHeight, 384);
    const up = h > room && above > room;
    menu.dataset.side = up ? "top" : "bottom";
    menu.style.maxHeight = Math.min(384, up ? above : room) + "px";
    menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
    menu.style.top = (up ? r.top - Math.min(h, above) - 4 : r.bottom + 4) + "px";

    document.addEventListener("pointerdown", outside, true);
    addEventListener("resize", close);
    addEventListener("scroll", onScroll, true);

    (search || items.find((i) => marked(i.dataset.value)) || items[0]).focus();
    menu.onkeydown = (e) => {
      const shown = items.filter((x) => !x.hidden);
      const i = shown.indexOf(document.activeElement);
      const typing = search && document.activeElement === search;
      const go = (n) => {
        e.preventDefault();
        if (n < 0 && search) search.focus();
        else if (shown.length) shown[(n + shown.length) % shown.length].focus();
      };
      if (e.key === "ArrowDown") go(i + 1);
      else if (e.key === "ArrowUp") go(i - 1);
      else if (e.key === "Home" && !typing) go(0);
      else if (e.key === "End" && !typing) go(shown.length - 1);
      else if (e.key === "Enter" || (e.key === " " && !typing)) { e.preventDefault(); (typing ? shown[0] : shown[i])?.click(); }
      else if (e.key === "Escape") { e.preventDefault(); close(true); }
      else if (e.key === "Tab") close(false);
    };
  }

  trigger.onclick = () => (menu ? close(true) : open());
  trigger.onkeydown = (e) => { if (["ArrowDown", "ArrowUp"].includes(e.key)) { e.preventDefault(); open(); } };
  return { el: trigger, set };
}

function Slider({ min, max, step, onChange }) {
  const W = 16; // the thumb is w-4
  let value = min;
  const range = el("span", { className: "slider-range" });
  const thumb = el("span", { className: "slider-thumb", role: "slider", tabIndex: 0 });
  const root = el("span", { className: "slider" }, el("span", { className: "slider-track" }, range), thumb);
  thumb.setAttribute("aria-valuemin", min);
  thumb.setAttribute("aria-valuemax", max);

  const clamp = (v) => Math.min(max, Math.max(min, v));
  const snap = (v) => clamp(Math.round((min + Math.round((v - min) / step) * step) * 1e10) / 1e10);
  const render = () => {
    const p = max > min ? ((value - min) / (max - min)) * 100 : 0;
    range.style.width = p + "%";
    thumb.style.left = `calc(${p}% + ${(0.5 - p / 100) * W}px)`;
    thumb.setAttribute("aria-valuenow", value);
  };
  const change = (v) => { v = snap(v); if (v !== value) { value = v; render(); onChange(v); } };
  const fromPointer = (e) => {
    const r = root.getBoundingClientRect();
    change(min + Math.min(1, Math.max(0, (e.clientX - r.left - W / 2) / (r.width - W))) * (max - min));
  };

  root.onpointerdown = (e) => { root.setPointerCapture(e.pointerId); fromPointer(e); thumb.focus(); };
  root.onpointermove = (e) => { if (root.hasPointerCapture(e.pointerId)) fromPointer(e); };
  thumb.onkeydown = (e) => {
    const d = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: step * 10, PageDown: -step * 10 }[e.key];
    if (d !== undefined) { e.preventDefault(); change(value + d); }
    else if (e.key === "Home") { e.preventDefault(); change(min); }
    else if (e.key === "End") { e.preventDefault(); change(max); }
  };
  return { el: root, set(v) { value = clamp(v); render(); } };
}

// A number typed as text (digits only), as the shop does it.
// min and max are kept as the counter keeps them: a number above max is cut at once (more digits can only make
// it bigger); one below min is allowed while typing ("1" on the way to "15") and fixed when the field is left.
// min and max may be functions (the limits move with a unit); plain draws a float without trailing zeros.
const trimNum = (x) => Number(x).toFixed(9).replace(/\.?0+$/, "");
function NumberInput({ type, decimals = 0, plain = false, empty = false, min, max, onChange = () => {}, className = "" }) {
  let value = 0;
  let last = "";
  const lo = () => (typeof min === "function" ? min() : min);
  const hi = () => (typeof max === "function" ? max() : max);
  const clamp = (v) => Math.min(hi() ?? Infinity, Math.max(lo() ?? -Infinity, v));

// A duration: a number (digits only, within the limits) and its unit. The wire value stays a Go duration string.
const UNITS = [["ns", "ns", 1], ["µs", "us", 1e3], ["ms", "ms", 1e6], ["s", "s", 1e9], ["min", "m", 6e10], ["h", "h", 3.6e12]]; // label, Go suffix, nanoseconds
const GO_UNIT = { ns: 1, us: 1e3, "µs": 1e3, "μs": 1e3, ms: 1e6, s: 1e9, m: 6e10, h: 3.6e12 };

  if (typeof s !== "string") return NaN;
  const neg = s.startsWith("-");
  const t = s.replace(/^[-+]/, "");
  if (t === "0") return 0;
  let total = 0;
  const rest = t.replace(/(\d+\.?\d*|\.\d+)(ns|us|µs|μs|ms|s|m|h)/g, (_, n, u) => { total += parseFloat(n) * GO_UNIT[u]; return ""; });
  return t === "" || rest !== "" ? NaN : Math.round(neg ? -total : total);
}
function Duration({ min, max, onChange }) {
  const lo = min != null ? parseDur(min) : null;
  const hi = max != null ? parseDur(max) : null;
  const unitOf = (ns) => { // the biggest unit that divides the value evenly
    if (!ns) return 3;
    for (let i = UNITS.length - 1; i > 0; i--) if (ns % UNITS[i][2] === 0) return i;
    return 0;
  };
  let first = lo > 0 ? unitOf(lo) : 0; // no unit smaller than the minimum or bigger than the maximum is offered
  const last = hi > 0 ? unitOf(hi) : UNITS.length - 1;
  if (first > last) first = last;
  let idx = Math.min(last, Math.max(first, 3));
  let ns = null;
  const per = () => UNITS[idx][2];
  const emit = () => { ns = Math.round(num.value * per()); onChange(trimNum(num.value) + UNITS[idx][1]); };
  const num = NumberInput({ type: "float", plain: true, min: lo == null ? undefined : () => lo / per(), max: hi == null ? undefined : () => hi / per(), className: "duration-input", onChange: emit });
  const unit = Select(UNITS.slice(first, last + 1).map((u) => u[0]), (name) => {
    idx = UNITS.findIndex((u) => u[0] === name);
    const v = Math.min(hi == null ? Infinity : hi / per(), Math.max(lo == null ? -Infinity : lo / per(), num.value)); // the same number, in the new unit, kept within the limits
    num.set(v);
    emit();
  });
  unit.el.classList.add("unit-select");
  // the width comes from the longest number the field can hold and the longest unit, so nothing moves while typing or switching
  const range = UNITS.slice(first, last + 1);
  const digits = Math.max(...range.map((u) => (hi == null ? 8 : trimNum(hi / u[2]).length)));
  num.el.style.width = `calc(${digits}ch + 24px)`;
  unit.el.style.width = `calc(${Math.max(...range.map((u) => u[0].length))}ch + 50px)`;
  return {
    el: el("div", { className: "duration" }, num.el, unit.el),
    set(v) {
      const d = parseDur(v);
      if (Number.isNaN(d) || d === ns) return; // it is what the field already holds
      ns = d;
      idx = Math.min(last, Math.max(first, unitOf(d)));
      unit.set(UNITS[idx][0]);
      num.set(d / per());
    },
  };
}

// A list or a set: a control of the item's own type to add one, and under it the items as removable chips.

  const order = (a, b) => (f.item === "duration" ? parseDur(a) - parseDur(b) : a < b ? -1 : a > b ? 1 : 0);

    if (f.item === "duration") {
      const ns = parseDur(x);
      const i = ns ? UNITS.findLastIndex((u) => ns % u[2] === 0) : 3;
      return trimNum(ns / UNITS[Math.max(i, 0)][2]) + " " + UNITS[Math.max(i, 0)][0];
    }

  let items = [];
  const chips = el("div", { className: "chips" });

  function render() {
    chips.replaceChildren();
    if (items.length === 0) chips.append(el("span", { className: "chips-empty", textContent: "No items" }));
    items.forEach((x, i) => {
      const rm = el("button", { type: "button", className: "chip-x", ariaLabel: "Remove " + show(x) }, icon("luX"));
      rm.onclick = () => { items = items.filter((_, j) => j !== i); render(); onChange(items.slice()); };

    focusable = input;

  }

  const root = el("div", { className: "chips-box" }, el("div", { className: "adder" }, control, ...(add_ ? [add_] : [])), chips); // the input on top, the list under it
  render();

// Entries of a data source: the ids a setting holds, chosen from a list that opens under an input as you type. The

    const e = el("span", { className: "avatar letter", textContent: ([...name][0] || "#").toUpperCase() });

    for (const id of ids) {
      const e = known(id);
